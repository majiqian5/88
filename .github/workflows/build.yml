name: Build LiquidGlassPrefs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS*.sdk $THEOS/sdks/ || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      - name: Create source files
        run: |
          echo '' | base64 -d > RootListController.m
          echo '' | base64 -d > Makefile
          echo '' | base64 -d > Info.plist
          echo '' | base64 -d > entry.plist
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make clean package FINALPACKAGE=1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LiquidAssPrefs.bundle
          path: .theos/obj/LiquidAssPrefs.bundle
