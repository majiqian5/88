name: Build LockPlayerMini
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          export THEOS=$HOME/theos
          # 自动下载iOS SDK
          $THEOS/bin/install-sdk 16.5

      - name: Install perl依赖
        run: sudo apt install -y libio-compress-lzma-perl build-essential fakeroot rsync curl perl git

      - name: Compile deb
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless SDKVERSION=16.5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockPlayerMini-deb
          path: packages/*.deb
