      - name: Compile
        run: |
          clang -arch arm64 -arch arm64e \
            -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS16.5.sdk \
            -target arm64-apple-ios15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit -framework CoreFoundation -framework CoreGraphics \
            -o LockPlayer.dylib Hooks/Tweak.m
          ldid -S LockPlayer.dylib
