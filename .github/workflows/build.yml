name: Build Deb

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - name: Checkout Theos
        run: git clone --recursive https://github.com/theos/theos.git $THEOS
      - name: Setup Path
        run: |
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "THEOS=$THEOS" >> $GITHUB_ENV
      - name: Install SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk $THEOS/sdks/
      - name: Install Deps
        run: brew install ldid dpkg make
      - name: Build
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
