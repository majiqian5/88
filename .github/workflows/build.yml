name: Build Deb

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          chmod +x $HOME/theos/bin/*
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Install Deps
        run: brew install ldid dpkg make

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
