name: Build Deb

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          sudo cp -R iPhoneOS16.5.sdk /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/

      - name: Install Deps
        run: brew install ldid dpkg

      - name: Compile Tweak
        run: |
          clang -arch arm64 -arch arm64e \
            -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS16.5.sdk \
            -target arm64-apple-ios15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit -framework CoreFoundation -framework QuartzCore \
            -lsubstrate \
            -o LockPlayer.dylib Hooks/Tweak.m
          ldid -S LockPlayer.dylib

      - name: Compile Pref Bundle
        run: |
          clang -arch arm64 -arch arm64e \
            -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS16.5.sdk \
            -target arm64-apple-ios15.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework UIKit \
            -o LockPlayerMiniPref.bundle/LockPlayerMiniPref \
            Prefs/RootVC.m
          ldid -S LockPlayerMiniPref.bundle/LockPlayerMiniPref

      - name: Package Deb
        run: |
          mkdir -p deb/var/jb/Library/MobileSubstrate/DynamicLibraries
          mkdir -p deb/var/jb/Library/PreferenceBundles
          mkdir -p deb/var/jb/Library/PreferenceLoader/Preferences
          cp LockPlayer.dylib deb/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp LockPlayer.plist deb/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp -r LockPlayerMiniPref.bundle deb/var/jb/Library/PreferenceBundles/
          cp LockPlayerMini.plist deb/var/jb/Library/PreferenceLoader/Preferences/
          mkdir -p deb/DEBIAN
          cp control deb/DEBIAN/
          find deb -type d -exec chmod 755 {} \;
          find deb -name "*.dylib" -exec chmod 755 {} \;
          find deb ! -name "*.dylib" -type f -exec chmod 644 {} \;
          dpkg-deb -b deb LockPlayer.deb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"
